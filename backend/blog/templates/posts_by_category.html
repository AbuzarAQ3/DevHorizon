{% extends 'base.html' %}

{% block content %}

<!-- all recent posts -->
<main role="main" class="container p-0">
  <div class="row">
    <div class="col-md-8 blog-main">

      <div class="blog-post">
        <h2 class="text-uppercase text-warning" style="letter-spacing: 2px">
          {{ category }} Posts
        </h2>
        {% for post in posts %}
        <div class="card border-0">
          <div class="card-body">
            <h3> {{ post.title }}</h3>
            <small class="mb-1 text-muted">{{ post.created_at | timesince }} ago | {{ post.author }}</small>
            <p class="card-text"> {{ post.short_description | truncatewords:25 }}</p>
          </div>
        </div>
        {% endfor %}
      </div>
      <!-- /.blog-post -->

    </div>
    <!-- /.blog-main -->


    {% endblock %}
